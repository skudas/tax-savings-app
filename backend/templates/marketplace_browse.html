<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Tax Professionals - Tax Savings Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; background: #f8fafb; }

        header { background: white; border-bottom: 1px solid #e5e7eb; padding: 1rem 0; position: sticky; top: 0; z-index: 100; }
        .navbar { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #2563eb; text-decoration: none; }
        nav { display: flex; gap: 2rem; }
        nav a { color: #374151; text-decoration: none; }
        nav a:hover { color: #2563eb; }
        .user-menu { display: flex; gap: 1rem; }
        .btn-primary { background: #2563eb; color: white; padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; text-decoration: none; }
        .btn-primary:hover { background: #1d4ed8; }

        main { max-width: 1200px; margin: 0 auto; padding: 2rem 20px; }

        .hero { background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%); color: white; padding: 3rem 2rem; border-radius: 1rem; margin-bottom: 3rem; }
        .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .hero p { font-size: 1.125rem; opacity: 0.9; margin-bottom: 1.5rem; }

        .filters { background: white; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; border: 1px solid #e5e7eb; }
        .filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; }

        .professionals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

        .professional-card { background: white; border: 1px solid #e5e7eb; border-radius: 0.5rem; overflow: hidden; transition: all 0.3s; }
        .professional-card:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.1); transform: translateY(-2px); }

        .card-header { padding: 1.5rem; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
        .card-name { font-size: 1.25rem; font-weight: bold; color: #1e293b; }
        .card-title { color: #64748b; font-size: 0.875rem; margin-top: 0.25rem; }
        .card-rating { color: #f59e0b; margin-top: 0.5rem; }

        .card-body { padding: 1.5rem; }
        .specialty { display: inline-block; background: #dbeafe; color: #1e40af; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; margin: 0.25rem; }
        .card-stats { display: flex; justify-content: space-between; margin: 1rem 0; font-size: 0.875rem; color: #64748b; }

        .rate-preview { background: #f3f4f6; padding: 1rem; border-radius: 0.375rem; margin: 1rem 0; }
        .rate-price { font-size: 1.5rem; font-weight: bold; color: #059669; }

        .card-footer { padding: 1.5rem; border-top: 1px solid #e5e7eb; display: flex; gap: 1rem; }
        .btn { flex: 1; padding: 0.75rem; border: none; border-radius: 0.375rem; cursor: pointer; text-align: center; text-decoration: none; font-weight: 500; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #e5e7eb; color: #1f2937; }
        .btn-secondary:hover { background: #d1d5db; }

        .loading { text-align: center; padding: 2rem; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { background: #1f2937; color: white; padding: 2rem 0; text-align: center; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="/" class="logo">💰 Tax Professionals</a>
            <nav>
                <a href="/marketplace/browse.html">Browse</a>
                <a href="/dashboard/client.html">My Bookings</a>
                <a href="/messages.html">Messages</a>
            </nav>
            <div class="user-menu">
                <a href="/auth/login.html" class="btn-primary" style="font-size: 0.875rem;">Sign In</a>
            </div>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Find Your Tax Professional</h1>
            <p>Connect with certified CPAs and tax experts to save money on taxes</p>
        </div>

        <div class="filters">
            <h3 style="margin-bottom: 1rem;">Search & Filter</h3>
            <div class="filter-row">
                <input type="text" id="searchInput" placeholder="Search by name or specialty...">
                <input type="text" id="specialtyInput" placeholder="e.g., S-Corp, LLC, Tax Planning">
                <select id="sortBy">
                    <option value="rating">Sort by Rating</option>
                    <option value="price">Sort by Price (Low to High)</option>
                    <option value="experience">Sort by Experience</option>
                </select>
                <button class="btn-primary" onclick="filterProfessionals()">Search</button>
            </div>
        </div>

        <div id="professionalsContainer" class="professionals-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading professionals...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Tax Savings Marketplace. All rights reserved.</p>
    </footer>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';

        async function loadProfessionals() {
            try {
                const response = await fetch(`${API_BASE}/professionals/`);
                const professionals = await response.json();
                displayProfessionals(professionals);
            } catch (error) {
                console.error('Error loading professionals:', error);
                document.getElementById('professionalsContainer').innerHTML = '<p>Error loading professionals</p>';
            }
        }

        function displayProfessionals(professionals) {
            const container = document.getElementById('professionalsContainer');

            if (professionals.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 2rem;">No professionals found</p>';
                return;
            }

            container.innerHTML = professionals.map(prof => `
                <div class="professional-card">
                    <div class="card-header">
                        <div class="card-name">${prof.user_name}</div>
                        <div class="card-title">${prof.certifications?.join(', ') || 'Tax Professional'}</div>
                        <div class="card-rating">⭐ ${prof.average_rating.toFixed(1)}/5 (${prof.total_consultations} consultations)</div>
                    </div>
                    <div class="card-body">
                        <p>${prof.bio || 'Experienced tax professional'}</p>
                        <div style="margin: 1rem 0;">
                            ${prof.specialties?.map(s => `<span class="specialty">${s}</span>`).join('') || ''}
                        </div>
                        <div class="card-stats">
                            <span>Experience: ${prof.years_experience || '—'} years</span>
                        </div>
                        ${prof.rate_cards?.length > 0 ? `
                            <div class="rate-preview">
                                <div style="font-size: 0.875rem; color: #64748b;">Starting at</div>
                                <div class="rate-price">$${Math.min(...prof.rate_cards.map(r => r.price)).toFixed(0)}</div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="card-footer">
                        <a href="/marketplace/profile.html?id=${prof.id}" class="btn btn-primary">View Profile</a>
                        <a href="/marketplace/book.html?professional_id=${prof.user_id}&profile_id=${prof.id}" class="btn btn-secondary">Book Now</a>
                    </div>
                </div>
            `).join('');
        }

        function filterProfessionals() {
            const specialty = document.getElementById('specialtyInput').value;
            const search = document.getElementById('searchInput').value;

            // Simple client-side filtering since search endpoint has issues
            fetch(`${API_BASE}/professionals/`)
                .then(r => r.json())
                .then(professionals => {
                    let filtered = professionals;

                    if (specialty) {
                        filtered = filtered.filter(p =>
                            p.specialties?.some(s => s.toLowerCase().includes(specialty.toLowerCase()))
                        );
                    }

                    if (search) {
                        filtered = filtered.filter(p =>
                            p.user_name.toLowerCase().includes(search.toLowerCase())
                        );
                    }

                    displayProfessionals(filtered);
                });
        }

        // Load on page load
        loadProfessionals();
    </script>
</body>
</html>
