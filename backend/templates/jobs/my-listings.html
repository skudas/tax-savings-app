<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your job postings, review applicants, and monitor your job posting subscription.">
  <title>My Job Listings | TaxSavings Job Marketplace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/marketplace.css">
  <link rel="stylesheet" href="/static/css/jobs.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container jobs-page">
    <div id="listingsRoot">
      <div class="loading-block" style="padding-top:6rem">
        <div class="spinner"></div>
        <span>Loading your job listings...</span>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/static/js/marketplace.js"></script>
  <script>
    (() => {
      document.addEventListener('DOMContentLoaded', () => {
        renderHeader('jobs');
        renderFooter();

        const root = document.getElementById('listingsRoot');
        const state = {
          user: null,
          jobs: [],
          subscription: null,
          filter: 'all',
          loading: true
        };

        const STATUS_LABELS = {
          open: 'Open',
          in_progress: 'In progress',
          closed: 'Closed',
          cancelled: 'Cancelled'
        };

        function redirectToLogin() {
          const redirect = `${window.location.pathname}${window.location.search}`;
          window.location.href = `/auth/login.html?redirect=${encodeURIComponent(redirect)}`;
        }

        function jobLink(job) {
          return `/jobs/detail.html?id=${encodeURIComponent(job.id)}`;
        }

        function statusOf(job) {
          const value = String(job.status || 'open').toLowerCase();
          return value === 'in_progress' || value === 'in-progress' ? 'in_progress' : value;
        }

        function applicantCount(job) {
          if (Array.isArray(job.applications)) return job.applications.length;
          return Number(job.applicant_count ?? job.application_count ?? 0);
        }

        function budgetText(job) {
          const min = Number(job.budget_min || 0);
          const max = Number(job.budget_max || 0);
          const suffix = String(job.budget_type || '').toLowerCase() === 'hourly' ? '/hr' : '';
          if (min && max && min !== max) return `${money(min)} - ${money(max)}${suffix}`;
          return `${money(max || min)}${suffix}`;
        }

        function subscriptionActive() {
          const sub = state.subscription;
          if (!sub) return false;
          if (sub.subscribed === true) return true;
          if (sub.subscribed === false) return false;
          return String(sub.status || '').toLowerCase() === 'active';
        }

        function maxJobs() {
          return Number(state.subscription?.max_concurrent_jobs || 10);
        }

        function openJobs() {
          return state.jobs.filter((job) => statusOf(job) === 'open').length;
        }

        function renewalDate() {
          const value = state.subscription?.renewal_date || state.subscription?.subscription_end;
          return value ? formatDate(value) : 'Not active';
        }

        function statusBadge(status) {
          const value = statusOf({ status });
          const style = {
            open: 'badge-green',
            in_progress: 'badge-primary',
            closed: 'badge-gray',
            cancelled: 'badge-red'
          }[value] || 'badge-gray';
          return `<span class="badge ${style}"><span class="badge-dot"></span>${escapeHtml(STATUS_LABELS[value] || value)}</span>`;
        }

        function applicationStatusBadge(status) {
          const value = String(status || 'pending').toLowerCase();
          const style = {
            pending: 'badge-amber',
            accepted: 'badge-green',
            hired: 'badge-green',
            rejected: 'badge-red'
          }[value] || 'badge-gray';
          return `<span class="badge ${style}">${escapeHtml(value.charAt(0).toUpperCase() + value.slice(1))}</span>`;
        }

        function safeUrl(value) {
          if (!value) return '';
          try {
            const url = new URL(value);
            return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
          } catch (error) {
            return '';
          }
        }

        function filteredJobs() {
          if (state.filter === 'all') return state.jobs;
          if (state.filter === 'closed') {
            return state.jobs.filter((job) => ['closed', 'cancelled'].includes(statusOf(job)));
          }
          return state.jobs.filter((job) => statusOf(job) === state.filter);
        }

        function renderSkeleton() {
          root.innerHTML = `
            <div class="page-head">
              <div>
                <div class="skeleton skeleton-line w-40"></div>
                <div class="skeleton skeleton-line w-60" style="height:34px;margin-top:.6rem"></div>
                <div class="skeleton skeleton-line w-80"></div>
              </div>
            </div>
            <div class="stat-grid">
              ${Array.from({ length: 4 }).map(() => `
                <div class="stat-card">
                  <div class="skeleton skeleton-avatar" style="margin:0;width:40px;height:40px"></div>
                  <div style="flex:1">
                    <div class="skeleton skeleton-line w-60"></div>
                    <div class="skeleton skeleton-line w-40" style="margin:0"></div>
                  </div>
                </div>`).join('')}
            </div>
            <div class="listings-layout">
              <div class="panel"><div class="panel-body">${spinnerBlock('Loading your job listings...')}</div></div>
              <div class="panel"><div class="panel-body">${spinnerBlock('Loading subscription...')}</div></div>
            </div>`;
        }

        function renderError(message) {
          root.innerHTML = `
            <div class="job-error-page">
              <div class="empty-state">
                <div class="icon-box amber">${icon('alert', 'icon-lg')}</div>
                <h3>We couldn't load your listings</h3>
                <p>${escapeHtml(message || 'Please check your connection and try again.')}</p>
                <button class="btn btn-primary" id="retryListings" type="button">Try again</button>
              </div>
            </div>`;
          const retry = document.getElementById('retryListings');
          if (retry) retry.addEventListener('click', () => load(true));
        }

        function renderStats() {
          const total = state.jobs.length;
          const open = openJobs();
          const inProgress = state.jobs.filter((job) => statusOf(job) === 'in_progress').length;
          const closed = state.jobs.filter((job) => ['closed', 'cancelled'].includes(statusOf(job))).length;

          return `
            <div class="stat-grid">
              <div class="stat-card">
                <div class="icon-box">${icon('file', 'icon-lg')}</div>
                <div class="stat-meta"><span>Total listings</span><strong>${total}</strong><small>All jobs you have posted</small></div>
              </div>
              <div class="stat-card">
                <div class="icon-box green">${icon('briefcase', 'icon-lg')}</div>
                <div class="stat-meta"><span>Open jobs</span><strong>${open}</strong><small>Accepting new applications</small></div>
              </div>
              <div class="stat-card">
                <div class="icon-box amber">${icon('clock', 'icon-lg')}</div>
                <div class="stat-meta"><span>In progress</span><strong>${inProgress}</strong><small>Professional selected</small></div>
              </div>
              <div class="stat-card">
                <div class="icon-box purple">${icon('checkCircle', 'icon-lg')}</div>
                <div class="stat-meta"><span>Closed</span><strong>${closed}</strong><small>Completed or cancelled</small></div>
              </div>
            </div>`;
        }

        function renderFilterTabs() {
          const filters = [
            { key: 'all', label: 'All', count: state.jobs.length },
            { key: 'open', label: 'Open', count: openJobs() },
            { key: 'in_progress', label: 'In progress', count: state.jobs.filter((job) => statusOf(job) === 'in_progress').length },
            { key: 'closed', label: 'Closed', count: state.jobs.filter((job) => ['closed', 'cancelled'].includes(statusOf(job))).length }
          ];

          return `
            <div class="tabs" role="tablist" aria-label="Filter job listings">
              ${filters.map((filter) => `
                <button class="tab-btn ${state.filter === filter.key ? 'active' : ''}" type="button" data-listing-filter="${filter.key}" role="tab" aria-selected="${state.filter === filter.key}">
                  ${escapeHtml(filter.label)} <span class="tab-count">${filter.count}</span>
                </button>`).join('')}
            </div>`;
        }

        function renderListing(job) {
          const status = statusOf(job);
          const applicants = applicantCount(job);
          const canClose = ['open', 'in_progress'].includes(status);

          return `
            <article class="listing-card">
              <div class="listing-card-top">
                <div style="min-width:0">
                  <div class="row-wrap">
                    <span class="badge badge-primary">${escapeHtml(job.category || 'General')}</span>
                    ${statusBadge(status)}
                  </div>
                  <h3><a href="${jobLink(job)}">${escapeHtml(job.title || 'Untitled job')}</a></h3>
                  <p class="job-description">${escapeHtml(job.description || 'No description provided.')}</p>
                </div>
                <div class="job-budget" style="margin-top:0;font-size:1.15rem;white-space:nowrap">${escapeHtml(budgetText(job))}</div>
              </div>
              <div class="job-meta-grid">
                <div class="job-meta-item">
                  <span>${icon('user', 'icon-sm')} Applicants</span>
                  <strong>${applicants}</strong>
                </div>
                <div class="job-meta-item">
                  <span>${icon('calendar', 'icon-sm')} Deadline</span>
                  <strong>${escapeHtml(job.deadline ? formatDate(job.deadline) : 'Flexible')}</strong>
                </div>
                <div class="job-meta-item">
                  <span>${icon('clock', 'icon-sm')} Duration</span>
                  <strong>${escapeHtml(job.estimated_duration || 'Flexible')}</strong>
                </div>
                <div class="job-meta-item">
                  <span>${icon('file', 'icon-sm')} Posted</span>
                  <strong>${escapeHtml(timeAgo(job.created_at) || 'Recently')}</strong>
                </div>
              </div>
              <div class="listing-actions">
                <a class="btn btn-outline btn-sm" href="${jobLink(job)}">${icon('eye', 'icon-sm')} View details</a>
                <button class="btn btn-primary btn-sm" type="button" data-view-apps="${job.id}">${icon('user', 'icon-sm')} View applications</button>
                ${canClose ? `<button class="btn btn-soft-danger btn-sm" type="button" data-close-job="${job.id}">${icon('x', 'icon-sm')} Close job</button>` : ''}
              </div>
            </article>`;
        }

        function renderListings() {
          const jobs = filteredJobs();
          if (!jobs.length) {
            const message = state.jobs.length
              ? 'No listings match this status filter. Try selecting a different tab.'
              : 'You have not posted any jobs yet. Create your first listing to start receiving bids from tax and finance professionals.';
            return `
              <div class="empty-state">
                <div class="icon-box">${icon('briefcase', 'icon-lg')}</div>
                <h3>${state.jobs.length ? 'No matching listings' : 'No job listings yet'}</h3>
                <p>${escapeHtml(message)}</p>
                <a class="btn btn-primary" href="/jobs/post.html">${icon('plus', 'icon-sm')} Post a job</a>
              </div>`;
          }
          return `<div class="listing-list">${jobs.map(renderListing).join('')}</div>`;
        }

        function renderSubscription() {
          const sub = state.subscription || {};
          const active = subscriptionActive();
          const used = openJobs();
          const max = maxJobs();
          const percent = Math.min(100, Math.round((used / max) * 100));
          const status = active ? 'Active' : (sub.status ? String(sub.status).replace(/_/g, ' ') : 'Inactive');

          return `
            <div class="panel subscription-card">
              <div class="subscription-top">
                <div>
                  <h2>Job posting plan</h2>
                  <p class="hint">${escapeHtml(sub.plan || '$50/year')} · up to ${max} concurrent open jobs</p>
                </div>
                <span class="badge ${active ? 'badge-green' : 'badge-amber'}">${escapeHtml(status)}</span>
              </div>
              <div class="subscription-meta">
                <div>
                  <span>Renewal date</span>
                  <strong>${escapeHtml(renewalDate())}</strong>
                </div>
                <div>
                  <span>Active jobs</span>
                  <strong>${used} of ${max}</strong>
                </div>
              </div>
              <div class="slot-meter">
                <div class="row-between">
                  <span>${used} of ${max} active job slots used</span>
                  <strong>${Math.max(0, max - used)} left</strong>
                </div>
                <div class="progress" role="progressbar" aria-valuenow="${used}" aria-valuemin="0" aria-valuemax="${max}" aria-label="Active job slots used">
                  <div class="progress-bar" style="width:${percent}%"></div>
                </div>
              </div>
              ${active
                ? `<a class="btn btn-primary btn-block" href="/jobs/post.html">${icon('plus', 'icon-sm')} Post a new job</a>`
                : `<button class="btn btn-primary btn-block" id="activateSubscription" type="button">${icon('credit', 'icon-sm')} Activate subscription</button>`}
              <p class="hint" style="margin:0">${active ? 'Your plan renews automatically. You can close a job to free up a slot at any time.' : 'An active subscription is required to publish and keep jobs open.'}</p>
            </div>`;
        }

        function render() {
          const active = subscriptionActive();
          root.innerHTML = `
            <div class="page-head">
              <div>
                <span class="eyebrow">${icon('briefcase', 'icon-sm')} Professional workspace</span>
                <h1>My job listings</h1>
                <p>Track open roles, review applicants, and manage your hiring pipeline.</p>
              </div>
              <div class="row">
                <a class="btn btn-outline" href="/jobs/browse.html">${icon('search', 'icon-sm')} Browse jobs</a>
                <a class="btn btn-primary" href="/jobs/post.html">${icon('plus', 'icon-sm')} Post a job</a>
              </div>
            </div>
            ${!active ? `
              <div class="alert alert-warning mb-4">
                ${icon('alert')}
                <div>
                  <strong>Your job posting subscription is inactive.</strong>
                  <div class="small">Activate the $50/year plan to publish new jobs and keep your listings open.</div>
                </div>
              </div>` : ''}
            ${renderStats()}
            <div class="listings-layout">
              <div class="listings-main">
                <div class="panel">
                  <div class="panel-head" style="flex-wrap:wrap">
                    <h2>Your listings</h2>
                    ${renderFilterTabs()}
                  </div>
                  <div class="panel-body">
                    ${renderListings()}
                  </div>
                </div>
              </div>
              <aside class="listings-side">
                ${renderSubscription()}
              </aside>
            </div>`;

          bindEvents();
        }

        function closeModal(backdrop, onKey) {
          if (onKey) document.removeEventListener('keydown', onKey);
          backdrop.remove();
        }

        async function openApplications(jobId) {
          const job = state.jobs.find((item) => Number(item.id) === Number(jobId));
          if (!job) return;

          const backdrop = document.createElement('div');
          backdrop.className = 'modal-backdrop';
          backdrop.innerHTML = `
            <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="applicationsTitle">
              <div class="modal-body">
                <div class="row-between">
                  <div>
                    <span class="badge badge-primary mb-2">${escapeHtml(job.category || 'General')}</span>
                    <h3 id="applicationsTitle">${escapeHtml(job.title || 'Applications')}</h3>
                    <p>${applicantCount(job)} applicant${applicantCount(job) === 1 ? '' : 's'}</p>
                  </div>
                  <button class="btn btn-ghost btn-sm" type="button" data-close-modal aria-label="Close">${icon('x', 'icon-sm')}</button>
                </div>
                <div id="applicationsBody" class="mt-4">${spinnerBlock('Loading applications...')}</div>
              </div>
              <div class="modal-actions">
                <button class="btn btn-outline" type="button" data-close-modal>Close</button>
              </div>
            </div>`;

          const onKey = (event) => {
            if (event.key === 'Escape') closeModal(backdrop, onKey);
          };
          document.addEventListener('keydown', onKey);
          backdrop.addEventListener('click', (event) => {
            if (event.target === backdrop) closeModal(backdrop, onKey);
          });
          backdrop.querySelectorAll('[data-close-modal]').forEach((button) => {
            button.addEventListener('click', () => closeModal(backdrop, onKey));
          });
          document.body.appendChild(backdrop);

          const body = backdrop.querySelector('#applicationsBody');
          const jobIsOpen = statusOf(job) === 'open';

          try {
            const applications = await api(`/jobs/${jobId}/applications`);
            if (!Array.isArray(applications) || !applications.length) {
              body.innerHTML = `
                <div class="empty-state" style="padding:2.5rem 1.5rem">
                  <div class="icon-box">${icon('user', 'icon-lg')}</div>
                  <h3>No applications yet</h3>
                  <p>Share your listing or wait for professionals to submit bids. You can close the job at any time.</p>
                </div>`;
              return;
            }

            body.innerHTML = `
              <div class="application-list">
                ${applications.map((application) => {
                  const portfolio = safeUrl(application.portfolio_url);
                  const name = application.applicant_name || `Applicant #${application.applied_by_user_id}`;
                  const rating = Number(application.applicant_rating || 0);
                  return `
                    <article class="application-card">
                      <div class="application-card-head">
                        <div class="poster-card" style="align-items:flex-start">
                          ${avatar(name)}
                          <div>
                            <h4>${escapeHtml(name)}</h4>
                            <span class="hint">${application.applicant_email ? escapeHtml(application.applicant_email) : 'Marketplace professional'}</span>
                            ${rating > 0 ? `<div class="mt-1">${ratingBlock(rating, application.applicant_total_consultations || 0)}</div>` : ''}
                          </div>
                        </div>
                        ${applicationStatusBadge(application.status)}
                      </div>
                      <div class="application-meta">
                        <span>${icon('dollar', 'icon-sm')} Bid: <strong>${escapeHtml(money(application.bid_amount || 0))}</strong></span>
                        <span>${icon('clock', 'icon-sm')} Timeline: <strong>${escapeHtml(application.proposed_timeline || 'Not specified')}</strong></span>
                        <span>${icon('calendar', 'icon-sm')} Applied ${escapeHtml(timeAgo(application.created_at) || 'recently')}</span>
                      </div>
                      ${application.cover_letter ? `<p class="cover-letter">${escapeHtml(application.cover_letter)}</p>` : ''}
                      <div class="application-actions">
                        ${portfolio ? `<a class="btn btn-outline btn-sm" href="${escapeHtml(portfolio)}" target="_blank" rel="noopener noreferrer">${icon('eye', 'icon-sm')} Portfolio</a>` : ''}
                        ${jobIsOpen && String(application.status || '').toLowerCase() === 'pending'
                          ? `<button class="btn btn-primary btn-sm" type="button" data-accept-application="${application.id}" data-applicant="${escapeHtml(name)}">${icon('check', 'icon-sm')} Accept bid</button>`
                          : ''}
                      </div>
                    </article>`;
                }).join('')}
              </div>`;

            body.addEventListener('click', async (event) => {
              const button = event.target.closest('[data-accept-application]');
              if (!button) return;
              const confirmed = await confirmDialog({
                title: 'Accept this bid?',
                message: `Accepting ${button.dataset.applicant}'s application will mark the job as in progress. Other applicants will remain in your list.`,
                confirmText: 'Accept bid',
                cancelText: 'Cancel'
              });
              if (!confirmed) return;

              setButtonLoading(button, true);
              try {
                await api(`/jobs/${jobId}/applications/${button.dataset.acceptApplication}/accept`, { method: 'PUT' });
                showToast('Application accepted. The job is now in progress.', 'success');
                closeModal(backdrop, onKey);
                await loadData(false);
              } catch (error) {
                showToast(error.message || 'Could not accept this application.', 'error');
                setButtonLoading(button, false);
              }
            });
          } catch (error) {
            body.innerHTML = `
              <div class="alert alert-error">
                ${icon('alert')}
                <div>
                  <strong>Could not load applications.</strong>
                  <div class="small">${escapeHtml(error.message || 'Please try again.')}</div>
                </div>
              </div>`;
          }
        }

        async function closeJob(jobId) {
          const job = state.jobs.find((item) => Number(item.id) === Number(jobId));
          if (!job) return;

          const confirmed = await confirmDialog({
            title: 'Close this job?',
            message: `"${job.title}" will stop accepting new applications. Existing applications remain available for review, and the slot can be reused for a new listing.`,
            confirmText: 'Close job',
            cancelText: 'Keep open',
            danger: true
          });
          if (!confirmed) return;

          try {
            await api(`/jobs/${jobId}/close`, { method: 'PUT' });
            showToast('Job closed successfully.', 'success');
            await loadData(false);
          } catch (error) {
            showToast(error.message || 'Could not close this job.', 'error');
          }
        }

        async function activateSubscription(button) {
          const confirmed = await confirmDialog({
            title: 'Activate job posting plan?',
            message: 'This activates the $50/year job posting subscription and allows up to 10 concurrent open jobs.',
            confirmText: 'Activate $50/year plan',
            cancelText: 'Not now'
          });
          if (!confirmed) return;

          setButtonLoading(button, true);
          try {
            await api('/jobs/subscribe', { method: 'POST' });
            showToast('Job posting subscription activated.', 'success');
            await loadData(false);
          } catch (error) {
            if (error.status === 401) {
              redirectToLogin();
              return;
            }
            showToast(error.message || 'Could not activate your subscription.', 'error');
          } finally {
            setButtonLoading(button, false);
          }
        }

        function bindEvents() {
          root.querySelectorAll('[data-listing-filter]').forEach((button) => {
            button.addEventListener('click', () => {
              state.filter = button.dataset.listingFilter;
              render();
            });
          });

          root.querySelectorAll('[data-view-apps]').forEach((button) => {
            button.addEventListener('click', () => openApplications(button.dataset.viewApps));
          });

          root.querySelectorAll('[data-close-job]').forEach((button) => {
            button.addEventListener('click', () => closeJob(button.dataset.closeJob));
          });

          const activate = document.getElementById('activateSubscription');
          if (activate) activate.addEventListener('click', () => activateSubscription(activate));
        }

        async function loadData(showSkeleton = true) {
          if (showSkeleton) {
            state.loading = true;
            renderSkeleton();
          }

          try {
            const [jobs, subscription] = await Promise.all([
              api('/my-jobs'),
              api('/jobs/subscription').catch(() => null)
            ]);
            state.jobs = Array.isArray(jobs) ? jobs : [];
            state.subscription = subscription;
            state.loading = false;
            render();
          } catch (error) {
            state.loading = false;
            if (error.status === 401) {
              redirectToLogin();
              return;
            }
            renderError(error.message);
          }
        }

        async function load(showSkeleton = true) {
          try {
            const user = await getCurrentUser();
            if (!user) {
              redirectToLogin();
              return;
            }
            state.user = user;
            await loadData(showSkeleton);
          } catch (error) {
            if (error.status === 401) {
              redirectToLogin();
              return;
            }
            renderError(error.message);
          }
        }

        load(true);
      });
    })();
  </script>
</body>
</html>
