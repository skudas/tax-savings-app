<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estimated Tax Calculator | TaxPilot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tax.css">
</head>
<body class="tax-app">
  <div id="taxNavRoot"></div>

  <main class="tax-shell">
    <div class="container">
      <div class="page-eyebrow">Quarterly Payments</div>
      <h1 class="page-title">Estimated tax calculator</h1>
      <p class="page-subtitle">Project your liability, calculate Form 1040-ES payments, and track the four due dates.</p>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card no-print">
            <div class="card-header"><i class="bi bi-calculator me-2 text-primary"></i>Payment inputs</div>
            <div class="card-body">
              <form id="estimateForm" class="row g-3">
                <div class="col-12">
                  <label class="form-label small fw-semibold" for="etReturn">Link to return (optional)</label>
                  <select class="form-select" id="etReturn"><option value="">Calculate manually</option></select>
                </div>
                <div class="col-6">
                  <label class="form-label small fw-semibold" for="etYear">Tax year</label>
                  <input class="form-control" id="etYear" type="number" min="2000" max="2100" required>
                </div>
                <div class="col-6">
                  <label class="form-label small fw-semibold" for="etStatus">Filing status</label>
                  <select class="form-select" id="etStatus"></select>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold" for="etProjected">Projected total tax</label>
                  <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="etProjected" type="number" min="0" step="100" placeholder="Auto from return"></div>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold" for="etNetProfit">Or net self-employment profit</label>
                  <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="etNetProfit" type="number" min="0" step="100" placeholder="Used if tax is blank"></div>
                </div>
                <div class="col-6">
                  <label class="form-label small fw-semibold" for="etWithholding">YTD withholding</label>
                  <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="etWithholding" type="number" min="0" step="100" value="0"></div>
                </div>
                <div class="col-6">
                  <label class="form-label small fw-semibold" for="etPriorTax">Prior-year tax</label>
                  <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="etPriorTax" type="number" min="0" step="100" placeholder="Optional"></div>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold" for="etPriorAgi">Prior-year AGI</label>
                  <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="etPriorAgi" type="number" min="0" step="1000" placeholder="Used for 110% safe harbor"></div>
                </div>
                <div class="col-12">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="etReminders" checked>
                    <label class="form-check-label small" for="etReminders">Email reminders 30 days before each due date</label>
                  </div>
                </div>
                <div class="col-12">
                  <button class="btn btn-tax-primary w-100" id="calculateBtn" type="submit"><i class="bi bi-arrow-repeat me-1"></i> Calculate quarterly payments</button>
                </div>
              </form>
            </div>
          </div>

          <div class="card mt-4">
            <div class="card-header"><i class="bi bi-clock-history me-2 text-primary"></i>Saved schedules</div>
            <div class="card-body p-0" id="savedSchedules">
              <div class="empty-state py-4 small">No saved schedules yet.</div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div id="estimateHost">
            <div class="card"><div class="card-body empty-state"><i class="bi bi-calendar-check"></i><div>Calculate to see your four quarterly payments.</div></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/tax.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const T = window.Tax;
      T.mountNav('estimated');
      await T.requireAuth();

      let returns = [];
      let activeReturn = null;
      let saved = [];
      let currentEstimate = null;

      document.getElementById('etYear').value = T.defaultTaxYear();
      document.getElementById('etStatus').innerHTML = T.filingStatusOptions('single');

      function renderSaved() {
        const host = document.getElementById('savedSchedules');
        if (!saved.length) {
          host.innerHTML = '<div class="empty-state py-4 small">No saved schedules yet.</div>';
          return;
        }
        host.innerHTML = `<div class="list-group list-group-flush">${saved.map((s) => `
          <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" data-saved-id="${s.id}" type="button">
            <span><span class="fw-semibold">${s.tax_year}</span><br><span class="small text-secondary">${T.money(s.total_estimated_tax)} projected</span></span>
            <span class="text-end"><div class="fw-semibold">${T.money(s.q1_amount)}</div><div class="small text-secondary">per quarter</div></span>
          </button>`).join('')}</div>`;
        host.querySelectorAll('[data-saved-id]').forEach((button) => {
          button.onclick = () => {
            const item = saved.find((s) => String(s.id) === String(button.dataset.savedId));
            if (item) {
              currentEstimate = item;
              document.getElementById('etYear').value = item.tax_year;
              renderEstimate(null, item);
            }
          };
        });
      }

      async function loadSaved() {
        saved = await T.api('/estimated-taxes');
        renderSaved();
      }

      async function loadReturns() {
        returns = await T.getReturns();
        const select = document.getElementById('etReturn');
        select.innerHTML = `<option value="">Calculate manually</option>` + returns.map((r) =>
          `<option value="${r.id}">${r.tax_year} · ${T.escapeHtml(r.filing_status_label)}</option>`).join('');
        const requested = T.queryParam('return_id');
        activeReturn = returns.find((r) => String(r.id) === String(requested)) || returns[0] || null;
        if (activeReturn) {
          select.value = activeReturn.id;
          document.getElementById('etYear').value = activeReturn.tax_year;
          document.getElementById('etStatus').value = activeReturn.filing_status;
          document.getElementById('etProjected').value = Number(activeReturn.estimated_tax || 0) || '';
          document.getElementById('etWithholding').value = Number(activeReturn.total_payments || 0) || 0;
        }
        select.onchange = () => {
          activeReturn = returns.find((r) => String(r.id) === select.value) || null;
          if (activeReturn) {
            document.getElementById('etYear').value = activeReturn.tax_year;
            document.getElementById('etStatus').value = activeReturn.filing_status;
            document.getElementById('etProjected').value = Number(activeReturn.estimated_tax || 0) || '';
            document.getElementById('etWithholding').value = Number(activeReturn.total_payments || 0) || 0;
          }
        };
      }

      function renderEstimate(calculation, savedRow) {
        const detail = savedRow || {};
        const schedule = detail.schedule || (calculation ? calculation.schedule : []);
        const projected = detail.total_estimated_tax != null ? detail.total_estimated_tax : (calculation ? calculation.projected_total_tax : 0);
        const safeHarbor = detail.safe_harbor_amount != null ? detail.safe_harbor_amount : (calculation ? calculation.safe_harbor_amount : 0);
        const quarterly = schedule.length ? schedule[0].amount : (calculation ? calculation.quarterly_payment : 0);
        const estimateId = detail.id || (currentEstimate && currentEstimate.id);
        document.getElementById('estimateHost').innerHTML = `
          <div class="row g-3">
            <div class="col-sm-4"><div class="stat-card blue"><div class="label">Projected tax</div><div class="value">${T.money(projected)}</div><div class="hint">Current-year liability</div></div></div>
            <div class="col-sm-4"><div class="stat-card"><div class="label">Safe harbor</div><div class="value">${T.money(safeHarbor)}</div><div class="hint">90% current / 100-110% prior</div></div></div>
            <div class="col-sm-4"><div class="stat-card green"><div class="label">Each quarter</div><div class="value">${T.money(quarterly)}</div><div class="hint">Form 1040-ES</div></div></div>
          </div>

          <div class="card mt-4">
            <div class="card-header d-flex justify-content-between align-items-center">
              <span><i class="bi bi-calendar3 me-2 text-primary"></i>Payment schedule</span>
              <button class="btn btn-sm btn-tax-soft" id="download1040es"><i class="bi bi-download me-1"></i> Form 1040-ES</button>
            </div>
            <div class="card-body">
              ${schedule.map((q) => `
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 py-3 border-bottom">
                  <div class="d-flex align-items-center gap-3">
                    <div class="qa-icon" style="width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:#eff4ff;color:#1d4ed8;font-weight:700">${T.escapeHtml(q.quarter)}</div>
                    <div>
                      <div class="fw-semibold">${T.money(q.amount)} due ${T.formatDate(q.due_date)}</div>
                      <div class="small text-secondary">${q.days_until_due == null ? '' : (q.days_until_due >= 0 ? q.days_until_due + ' days remaining' : Math.abs(q.days_until_due) + ' days past due')}${q.paid ? ' · Paid' : ''}</div>
                    </div>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <span class="pill ${q.paid ? 'pill-filed' : (q.days_until_due != null && q.days_until_due < 0 ? 'pill-danger' : 'pill-ready')}">${q.paid ? 'Paid' : (q.days_until_due != null && q.days_until_due < 0 ? 'Past due' : 'Upcoming')}</span>
                    ${estimateId ? `<button class="btn btn-sm ${q.paid ? 'btn-outline-secondary' : 'btn-outline-success'}" data-quarter="${q.quarter.toLowerCase()}" data-paid="${q.paid ? 'false' : 'true'}">${q.paid ? 'Undo' : 'Mark paid'}</button>` : ''}
                  </div>
                </div>`).join('')}
            </div>
          </div>

          <div class="card mt-4">
            <div class="card-header"><i class="bi bi-info-circle me-2 text-primary"></i>How this is calculated</div>
            <div class="card-body small text-secondary">
              <ul class="mb-0 ps-3">
                ${(calculation && calculation.notes ? calculation.notes : ['Safe harbor requires 90% of current-year tax or 100% of prior-year tax (110% when prior AGI exceeds $150,000).']).map((n) => `<li>${T.escapeHtml(n)}</li>`).join('')}
              </ul>
              <div class="mt-3">Reminders are scheduled 30 days before each due date. Due dates: April 15, June 15, September 15, and January 15 of the following year.</div>
            </div>
          </div>
          <div class="disclaimer-box mt-4">Estimates only. Underpayment penalties may apply if safe harbor is not met.</div>`;

        const download = document.getElementById('download1040es');
        if (download) {
          download.onclick = () => {
            const lines = schedule.map((q) => `<div class="line"><span class="no">${q.quarter}</span><span>Estimated payment due ${T.formatDate(q.due_date)}</span><span class="amount">${T.money(q.amount, 2)}</span></div>`).join('');
            T.printHtml('Form 1040-ES', `<h1>Form 1040-ES</h1><div class="sub">Estimated Tax for Individuals · Tax year ${T.escapeHtml(detail.tax_year || document.getElementById('etYear').value)}</div>
              ${lines}
              <div class="line"><span class="no"></span><span><strong>Total estimated payments</strong></span><span class="amount"><strong>${T.money(projected)}</strong></span></div>
              <div class="note">Planning estimate generated by TaxPilot. Verify with Form 1040-ES instructions and your tax professional.</div>`);
          };
        }

        document.querySelectorAll('[data-quarter]').forEach((button) => {
          button.onclick = async () => {
            if (!estimateId) return;
            try {
              const updated = await T.api(`/estimated-taxes/${estimateId}/paid?quarter=${button.dataset.quarter}&paid=${button.dataset.paid}`, { method: 'PATCH' });
              currentEstimate = updated;
              await loadSaved();
              renderEstimate(null, updated);
              T.toast('Payment status updated', 'success');
            } catch (error) {
              T.toast(error.message, 'error');
            }
          };
        });
      }

      document.getElementById('estimateForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = document.getElementById('calculateBtn');
        T.setLoading(button, true, 'Calculating...');
        try {
          const projected = document.getElementById('etProjected').value;
          const netProfit = document.getElementById('etNetProfit').value;
          const priorTax = document.getElementById('etPriorTax').value;
          const priorAgi = document.getElementById('etPriorAgi').value;
          const payload = {
            tax_year: Number(document.getElementById('etYear').value),
            filing_status: document.getElementById('etStatus').value,
            tax_return_id: activeReturn ? activeReturn.id : null,
            projected_total_tax: projected === '' ? null : Number(projected),
            net_profit: netProfit === '' ? null : Number(netProfit),
            prior_year_tax: priorTax === '' ? null : Number(priorTax),
            prior_year_agi: priorAgi === '' ? null : Number(priorAgi),
            withholding: Number(document.getElementById('etWithholding').value || 0),
            reminders_enabled: document.getElementById('etReminders').checked,
          };
          const result = await T.api('/estimated-taxes', { method: 'POST', body: payload });
          currentEstimate = result.estimated_tax;
          renderEstimate(result.calculation, result.estimated_tax);
          await loadSaved();
          T.toast('Estimated payment schedule saved', 'success');
        } catch (error) {
          T.toast(error.message, 'error');
        } finally {
          T.setLoading(button, false);
        }
      });

      try {
        await loadReturns();
        await loadSaved();
        if (saved.length) {
          currentEstimate = saved[0];
          renderEstimate(null, saved[0]);
        }
      } catch (error) {
        T.toast(error.message, 'error');
      }
    });
  </script>
</body>
</html>
