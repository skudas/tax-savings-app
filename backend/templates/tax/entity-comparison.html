<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entity Comparison Tool | TaxPilot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tax.css">
</head>
<body class="tax-app">
  <div id="taxNavRoot"></div>

  <main class="tax-shell">
    <div class="container">
      <div class="page-eyebrow">Multi-Entity Tax Optimization</div>
      <h1 class="page-title">Compare entity structures</h1>
      <p class="page-subtitle">See the projected federal, payroll, and state tax impact of sole proprietorship, LLC, S-Corp, C-Corp, and partnership treatment.</p>

      <div class="card no-print">
        <div class="card-body">
          <form id="entityForm" class="row g-3">
            <div class="col-md-3">
              <label class="form-label small fw-semibold" for="ecRevenue">Annual gross revenue</label>
              <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="ecRevenue" type="number" min="0" step="1000" value="250000" required></div>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold" for="ecExpenses">Annual expenses</label>
              <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="ecExpenses" type="number" min="0" step="1000" value="75000" required></div>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold" for="ecYear">Tax year</label>
              <input class="form-control" id="ecYear" type="number" min="2000" max="2100" required>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold" for="ecStatus">Filing status</label>
              <select class="form-select" id="ecStatus"></select>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-semibold" for="ecState">State</label>
              <select class="form-select" id="ecState"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold" for="ecSalary">Owner W-2 salary (optional)</label>
              <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="ecSalary" type="number" min="0" step="1000" placeholder="Auto: 60% S-Corp / 40% C-Corp"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold" for="ecOther">Other household income</label>
              <div class="input-group"><span class="input-group-text">$</span><input class="form-control" id="ecOther" type="number" min="0" step="1000" value="0"></div>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-tax-primary w-100" id="compareBtn" type="submit"><i class="bi bi-diagram-3 me-1"></i> Compare entities</button>
            </div>
          </form>
        </div>
      </div>

      <div id="comparisonHost" class="mt-4">
        <div class="card"><div class="card-body empty-state"><i class="bi bi-diagram-3"></i><div>Enter your numbers and run the comparison.</div></div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/tax.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const T = window.Tax;
      T.mountNav('entities');
      await T.requireAuth();

      document.getElementById('ecYear').value = T.defaultTaxYear();
      document.getElementById('ecStatus').innerHTML = T.filingStatusOptions('single');
      document.getElementById('ecState').innerHTML = T.stateOptions('CA');

      const filingRequirements = {
        sole_proprietor: ['Schedule C with Form 1040', 'Schedule SE', 'Quarterly estimated taxes if owed $1,000+'],
        llc_disregarded: ['Same filings as sole proprietor', 'No separate federal return by default'],
        llc_s_corp: ['Form 1120-S', 'Form 2553 election', 'W-2 payroll and K-1'],
        s_corp: ['Form 1120-S', 'Form 2553 election', 'Reasonable W-2 salary', 'K-1 to shareholders'],
        c_corp: ['Form 1120', '21% corporate income tax', 'Double taxation on dividends'],
        partnership: ['Form 1065', 'K-1 to each partner', 'Partnership SE tax on distributive shares'],
      };

      function card(scenario, bestType) {
        const best = scenario.entity_type === bestType;
        return `<div class="col-md-6 col-xl-4">
          <div class="entity-card ${best ? 'best' : ''}">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="entity-name">${T.escapeHtml(scenario.label)}</div>
                <div class="small text-secondary">${T.escapeHtml(scenario.description)}</div>
              </div>
              ${best ? '<span class="pill pill-filed">Recommended</span>' : ''}
            </div>
            <div class="entity-total mt-3">${T.money(scenario.total_tax)}</div>
            <div class="small text-secondary">projected total tax</div>
            <div class="d-flex justify-content-between small mt-3">
              <span class="text-secondary">vs. sole prop</span>
              <strong class="${scenario.savings_vs_sole_prop >= 0 ? 'text-success' : 'text-danger'}">${scenario.savings_vs_sole_prop >= 0 ? '+' : ''}${T.money(scenario.savings_vs_sole_prop)}</strong>
            </div>
            <div class="d-flex justify-content-between small">
              <span class="text-secondary">Take-home</span><strong>${T.money(scenario.take_home)}</strong>
            </div>
            <hr class="my-2">
            <div class="small text-secondary">${(filingRequirements[scenario.entity_type] || []).slice(0, 2).map((r) => `<div class="d-flex gap-1"><i class="bi bi-check2 text-primary"></i><span>${T.escapeHtml(r)}</span></div>`).join('')}</div>
          </div>
        </div>`;
      }

      function render(result) {
        const best = result.recommendation;
        const host = document.getElementById('comparisonHost');
        host.innerHTML = `
          <div class="recommend-banner mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
              <div>
                <div class="page-eyebrow mb-1">Recommended structure</div>
                <h3 class="h5 fw-bold mb-1">${T.escapeHtml(best.label)}</h3>
                <div class="text-secondary small">${T.escapeHtml(best.reason)}</div>
              </div>
              <div class="text-end">
                <div class="fs-4 fw-bold text-success">${T.money(best.estimated_total_tax)}</div>
                <div class="small text-secondary">lowest projected total tax</div>
                <div class="small fw-semibold text-success">${T.money(best.estimated_savings_vs_sole_prop)} saved vs. sole prop</div>
              </div>
            </div>
          </div>

          <div class="row g-3">${result.scenarios.map((s) => card(s, best.entity_type)).join('')}</div>

          <div class="card mt-4">
            <div class="card-header"><i class="bi bi-table me-2 text-primary"></i>Tax breakdown</div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-tax mb-0">
                  <thead><tr>
                    <th>Entity</th><th class="text-end">Owner salary</th><th class="text-end">Payroll tax</th>
                    <th class="text-end">Income tax</th><th class="text-end">Corporate tax</th><th class="text-end">State tax</th>
                    <th class="text-end">Total tax</th><th class="text-end">Take-home</th>
                  </tr></thead>
                  <tbody>
                    ${result.scenarios.map((s) => `<tr class="${s.entity_type === best.entity_type ? 'table-success' : ''}">
                      <td class="fw-semibold">${T.escapeHtml(s.label)}</td>
                      <td class="text-end">${T.money(s.owner_salary)}</td>
                      <td class="text-end">${T.money(s.payroll_tax)}</td>
                      <td class="text-end">${T.money(s.income_tax)}</td>
                      <td class="text-end">${T.money(s.corporate_tax)}</td>
                      <td class="text-end">${T.money(s.state_tax)}</td>
                      <td class="text-end fw-bold">${T.money(s.total_tax)}</td>
                      <td class="text-end">${T.money(s.take_home)}</td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="row g-4 mt-1">
            <div class="col-lg-7">
              <div class="card h-100">
                <div class="card-header"><i class="bi bi-list-check me-2 text-primary"></i>Filing requirements by entity</div>
                <div class="card-body">
                  ${Object.entries(filingRequirements).filter(([key]) => !key.startsWith('llc_') || key === 'llc_s_corp').map(([key, items]) => `
                    <div class="mb-3">
                      <div class="fw-semibold small text-capitalize">${T.escapeHtml(key.replace(/_/g, ' '))}</div>
                      <ul class="small text-secondary mb-0 ps-3">${items.map((i) => `<li>${T.escapeHtml(i)}</li>`).join('')}</ul>
                    </div>`).join('')}
                </div>
              </div>
            </div>
            <div class="col-lg-5">
              <div class="card h-100">
                <div class="card-header"><i class="bi bi-info-circle me-2 text-primary"></i>Assumptions</div>
                <div class="card-body small text-secondary">
                  <div class="d-flex justify-content-between py-1"><span>Net profit</span><strong>${T.money(result.input.net_profit)}</strong></div>
                  <div class="d-flex justify-content-between py-1"><span>Tax year</span><strong>${result.input.tax_year}</strong></div>
                  <div class="d-flex justify-content-between py-1"><span>State</span><strong>${T.escapeHtml(result.input.state || 'None')}</strong></div>
                  <ul class="mt-3 mb-0 ps-3">
                    ${Object.entries(result.assumptions).filter(([k, v]) => typeof v === 'string').map(([k, v]) => `<li>${T.escapeHtml(v)}</li>`).join('')}
                    <li>Excluded: ${T.escapeHtml((result.assumptions.excluded || []).join(', '))}</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          <div class="disclaimer-box mt-4">${T.escapeHtml(result.assumptions.disclaimer)}</div>`;
      }

      document.getElementById('entityForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = document.getElementById('compareBtn');
        T.setLoading(button, true, 'Calculating...');
        try {
          const salary = document.getElementById('ecSalary').value;
          const payload = {
            annual_revenue: Number(document.getElementById('ecRevenue').value),
            annual_expenses: Number(document.getElementById('ecExpenses').value),
            tax_year: Number(document.getElementById('ecYear').value),
            filing_status: document.getElementById('ecStatus').value,
            state: document.getElementById('ecState').value,
            owner_w2_salary: salary === '' ? null : Number(salary),
            other_income: Number(document.getElementById('ecOther').value || 0),
          };
          const result = await T.api('/entity-comparison', { method: 'POST', body: payload });
          render(result);
          T.toast('Entity comparison complete', 'success');
        } catch (error) {
          T.toast(error.message, 'error');
        } finally {
          T.setLoading(button, false);
        }
      });
    });
  </script>
</body>
</html>
